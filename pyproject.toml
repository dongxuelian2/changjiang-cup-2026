[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changjiang-select"
version = "0.1.0"
description = "Scenario-based protein candidate portfolio research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
cj-select = "changjiang_select.cli:main"

[tool.setuptools.packages.find]
include = ["changjiang_select*"]
